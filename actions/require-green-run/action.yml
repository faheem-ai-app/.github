name: require-green-run
description: >-
  Reuse an earlier green test run instead of testing the same code again (test once, promote the result). `exact` (default) refuses a deploy unless the exact commit has a green run on the source branch. `tree` reports whether the merged PR's green run already tested this exact tree (`reused` output); it never fails on a miss. Reads the GitHub API only; needs `actions: read` (tree mode also `pull-requests: read` and `contents: read`).
inputs:
  evidence:
    description: >-
      One spec per line, `<workflow file>: <job>[, <job>...]`. Exact: a completed, successful push or workflow_dispatch run of that workflow for this exact SHA on the source branch, every named job green. Tree: the same, for a pull_request run on the merged PR's head.
    required: true
  mode:
    description: exact (prod gate, fails closed) or tree (after a merge on a landing branch, never fails on a miss).
    required: false
    default: exact
  source-branch:
    description: Exact mode, the branch whose runs count (prod promotes from dev). Tree mode, the landing branch.
    required: false
    default: dev
  sha:
    description: Commit to check; defaults to the commit this workflow runs on.
    required: false
    default: ''
  token:
    description: Token with the read scopes above on this repository.
    required: false
    default: ${{ github.token }}
outputs:
  reused:
    description: '`true` when green evidence was found (always `true` after a passing exact check).'
    value: ${{ steps.check.outputs.reused }}
  run-urls:
    description: Space-separated URLs of the accepted evidence runs.
    value: ${{ steps.check.outputs.run-urls }}
runs:
  using: composite
  steps:
    - name: Look for a green run of this code
      id: check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GREEN_RUN_MODE: ${{ inputs.mode }}
        GREEN_RUN_EVIDENCE: ${{ inputs.evidence }}
        GREEN_RUN_SOURCE_BRANCH: ${{ inputs.source-branch }}
        GREEN_RUN_SHA: ${{ inputs.sha || github.sha }}
        GREEN_RUN_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$GREEN_RUN_ACTION_PATH/require_green_run.py"
